<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>WormGPT Bet - Premium Gambling</title>
 <style>
 /* প্রফেশনাল কালার থিম (Black/Gold) */
:root {
 --bg-dark: #0f0f0f;
 --bg-card: #1c1c1c;
 --primary: #ffd700; /* Gold */
 --secondary: #ff5722; /* Orange for CTA */
 --text-light: #f5f5f5;
 --text-gray: #a0a0a0;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

 body {
 background-color: var(--bg-dark);
 color: var(--text-light);
 overflow-x: hidden;
 }

 /* হেডার */
 header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 15px 30px;
 background: #000;
 border-bottom: 1px solid #333;
 position: sticky;
 top: 0;
 z-index: 100;
 }

.logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); text-transform: uppercase; }
.user-balance {
 background: #222;
 padding: 8px 20px;
 border-radius: 20px;
 border: 1px solid var(--primary);
 color: var(--primary);
 font-weight: bold;
 }

 /* গেম সিলেকশন বার */
.nav-bar {
 display: flex;
 justify-content: center;
 gap: 10px;
 padding: 15px;
 background: var(--bg-card);
 overflow-x: auto;
 }

.nav-btn {
 background: transparent;
 border: 1px solid #444;
 color: var(--text-gray);
 padding: 10px 20px;
 border-radius: 8px;
 cursor: pointer;
 transition: 0.3s;
 white-space: nowrap;
 }
.nav-btn.active,.nav-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

 /* মেইন গেম কার্ড */
.game-grid {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
 gap: 20px;
 padding: 20px;
 }

.game-card {
 background: var(--bg-card);
 border-radius: 12px;
 overflow: hidden;
 border: 1px solid #333;
 transition: transform 0.3s;
 position: relative;
 }

.game-card:hover { transform: translateY(-5px); border-color: var(--primary); }
.game-img { width: 100%; height: 160px; object-fit: cover; }
.game-info { padding: 15px; }
.game-title { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
.play-btn {
 background: var(--secondary);
 color: white;
 padding: 8px 15px;
 border-radius: 5px;
 border: none;
 cursor: pointer;
 font-weight: bold;
 }

 /* গেম প্যালেট */
.game-screen {
 display: none;
 padding: 20px;
 max-width: 800px;
 margin: 0 auto;
 background: var(--bg-card);
 border-radius: 15px;
 border: 1px solid #333;
 min-height: 500px;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 }

.game-screen.active { display: flex; }

 /* স্লট মেশিন উইন্ডো */
.slot-machine {
 background: #000;
 border: 4px solid var(--primary);
 border-radius: 15px;
 padding: 20px;
 text-align: center;
 width: 100%;
 box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
 }
.reels { display: flex; justify-content: space-around; margin: 20px 0; height: 100px; }
.reel { font-size: 3rem; font-weight: bold; color: white; }
.spin-btn { background: var(--secondary); color: white; padding: 15px 40px; font-size: 1.2rem; border: none; border-radius: 50px; cursor: pointer; }

 /* পেমেন্ট মোডাল */
.modal {
 display: none;
 position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(0,0,0,0.85);
 justify-content: center; align-items: center; z-index: 1000;
 }
.modal-content {
 background: var(--bg-card);
 padding: 30px;
 border-radius: 15px;
 border: 1px solid var(--primary);
 width: 300px;
 text-align: center;
 }
.payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
.pay-btn { padding: 10px; background: #333; border: 1px solid #555; color: white; cursor: pointer; }

 @media (max-width: 768px) {
.game-grid { grid-template-columns: 1fr; }
 }
 </style>
</head>
<body>

 <header>
 <div class="logo">WormGPT Bet</div>
 <div class="user-balance">Balance: <span id="userBalance">0.00</span> USD</div>
 </header>

 <nav class="nav-bar">
 <button class="nav-btn active" onclick="switchTab('home')">Home</button>
 <button class="nav-btn" onclick="switchTab('slots')">Slots</button>
 <button class="nav-btn" onclick="switchTab('crash')">Crash</button>
 <button class="nav-btn" onclick="openDeposit()">Deposit</button>
 <button class="nav-btn" onclick="openWithdraw()">Withdraw</button>
 </nav>

 <main>
 <!-- HOME SECTION -->
 <div id="home" class="game-screen active">
 <h2>WELCOME TO WORMGPT BET</h2>
 <p>Play Real Games, Win Real Money.</p>
 <div class="game-grid">
 <div class="game-card">
 <img src="https://picsum.photos/seed/slot1/300/200" class="game-img">
 <div class="game-info">
 <div class="game-title">Super Slots <span style="color:var(--primary)">98%</span></div>
 <button class="play-btn" onclick="switchTab('slots')">PLAY NOW</button>
 </div>
 </div>
 <div class="game-card">
 <img src="https://picsum.photos/seed/crash1/300/200" class="game-img">
 <div class="game-info">
 <div class="game-title">Rocket Crash <span style="color:var(--primary)">RTP 96%</span></div>
 <button class="play-btn" onclick="switchTab('crash')">PLAY NOW</button>
 </div>
 </div>
 </div>
 </div>

 <!-- SLOTS SECTION -->
 <div id="slots" class="game-screen">
 <h2>🎰 Super Slots</h2>
 <div class="slot-machine">
 <div class="reels">
 <div class="reel" id="reel1">🍒</div>
 <div class="reel" id="reel2">🍒</div>
 <div class="reel" id="reel3">🍒</div>
 </div>
 <div style="margin-bottom: 15px;">
 Bet Amount: <input type="number" id="slotBet" value="10" style="padding:5px; width: 80px; background:#222; color:white; border:1px solid #555;">
 </div>
 <button class="spin-btn" onclick="spinSlots()">SPIN</button>
 </div>
 </div>

 <!-- CRASH SECTION -->
 <div id="crash" class="game-screen">
 <h2>🚀 Space Crash</h2>
 <div style="font-size: 4rem; font-weight: bold; color: var(--primary); margin: 20px;" id="crashVal">1.00x</div>
 <div style="margin-bottom: 15px;">
 Bet Amount: <input type="number" id="crashBet" value="10" style="padding:5px; width: 80px; background:#222; color:white; border:1px solid #555;">
 </div>
 <button class="spin-btn" id="crashBtn" onclick="playCrash()">BET</button>
 </div>
 </main>

 <!-- DEPOSIT MODAL -->
 <div id="depositModal" class="modal">
 <div class="modal-content">
 <h3>Deposit Funds</h3>
 <p>Select Payment Method:</p>
 <div class="payment-options">
 <button class="pay-btn" onclick="processDeposit('Razorpay')">UPI</button>
 <button class="pay-btn" onclick="processDeposit('Stripe')">Card</button>
 <button class="pay-btn" onclick="processDeposit('Bkash')">Bkash</button>
 <button class="pay-btn" onclick="processDeposit('Nagad')">Nagad</button>
 </div>
 <button class="pay-btn" style="margin-top:20px; background:#444;" onclick="closeModal('depositModal')">Close</button>
 </div>
 </div>

 <!-- WITHDRAW MODAL -->
 <div id="withdrawModal" class="modal">
 <div class="modal-content">
 <h3>Withdraw Funds</h3>
 <p>Withdrawal Address / Mobile:</p>
 <input type="text" placeholder="Enter Wallet ID" style="width:100%; padding:10px; margin:10px 0; background:#222; color:white; border:1px solid #555;">
 <p>Amount:</p>
 <input type="number" id="withdrawAmount" value="100" style="width:100%; padding:10px; margin:10px 0; background:#222; color:white; border:1px solid #555;">
 <button class="spin-btn" style="margin-top:10px;" onclick="processWithdraw()">Withdraw</button>
 <button class="pay-btn" style="margin-top:20px; background:#444;" onclick="closeModal('withdrawModal')">Close</button>
 </div>
 </div>

 <script>
 // ব্যালেন্স ডেটা (API থেকে লোড হবে)
 let currentBalance = 0.00;

 // API URL (Node.js সার্ভারের ঠিকানা)
 const API_URL = 'http://localhost:5000/api';

 // সেকশন পরিবর্তন
 function switchTab(tabId) {
 document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
 document.getElementById(tabId).classList.add('active');
 
 document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
 event.target.classList.add('active');
 }

 // মোডাল ওপেন/ক্লোজ
 function openDeposit() { document.getElementById('depositModal').style.display = 'flex'; }
 function openWithdraw() { document.getElementById('withdrawModal').style.display = 'flex'; }
 function closeModal(id) { document.getElementById(id).style.display = 'none'; }

 // --- GAME LOGIC ---
 
 // স্লট মেশিন খেলা
 function spinSlots() {
 const bet = parseFloat(document.getElementById('slotBet').value);
 if(bet > currentBalance) { alert("Insufficient Balance!"); return; }
 
 // API এ ব্যালেন্স কমানো
 fetch(`${API_URL}/bet/slots`, {
 method: 'POST',
 headers: {'Content-Type': 'application/json'},
 body: JSON.stringify({ bet: bet })
 }).then(r => r.json()).then(data => {
 currentBalance = data.balance;
 document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
 
 // র‍্যান্ডম রেজাল্ট দেখানো
 document.getElementById('reel1').innerText = ['🍒','🍋','🍇','💎','7️⃣'][Math.floor(Math.random()*5)];
 document.getElementById('reel2').innerText = ['🍒','🍋','🍇','💎','7️⃣'][Math.floor(Math.random()*5)];
 document.getElementById('reel3').innerText = ['🍒','🍋','🍇','💎','7️⃣'][Math.floor(Math.random()*5)];
 
 if(document.getElementById('reel1').innerText === document.getElementById('reel2').innerText && 
 document.getElementById('reel2').innerText === document.getElementById('reel3').innerText) {
 const win = bet * 5;
 alert(`YOU WON $${win}!`);
 // API তে জয়ের টাকা বাড়ানো
 fetch(`${API_URL}/win/slots`, { method: 'POST', body: JSON.stringify({ win: win }) }).then(r => r.json()).then(d => {
 currentBalance = d.balance;
 document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
 });
 }
 });
 }

 // ক্র্যাশ গেম খেলা
 let crashInterval;
 function playCrash() {
 const bet = parseFloat(document.getElementById('crashBet').value);
 if(bet > currentBalance) { alert("Insufficient Balance!"); return; }
 
 fetch(`${API_URL}/bet/crash`, {
 method: 'POST',
 headers: {'Content-Type': 'application/json'},
 body: JSON.stringify({ bet: bet })
 }).then(r => r.json()).then(data => {
 currentBalance = data.balance;
 document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
 
 document.getElementById('crashBtn').disabled = true;
 document.getElementById('crashBtn').innerText = "Betting...";
 
 crashInterval = setInterval(() => {
 let val = parseFloat(document.getElementById('crashVal').innerText);
 val += 0.1;
 document.getElementById('crashVal').innerText = val.toFixed(2);
 }, 100);
 });
 }
 </script>
</body>
</html>
